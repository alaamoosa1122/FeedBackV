version: '3.8'

services:
  # client (React App)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - server
    environment:
      - REACT_APP_API_URL=http://localhost:3001
    networks:
      - feedback-network

  # Server (Node.js/Express)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
       PORT: 3001 
       MONGO_USERNAME: admin
       MONGO_PASSWORD: admin
       MONGO_DATABASE: peerDB
    networks:
      - feedback-network

networks:
  feedback-network:
    driver: bridge 